name: Renovate

on:
  schedule:
    # Weekly on Monday at 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run Renovate
        uses: renovatebot/github-action@v46.2.5
        with:
          configurationFile: renovate.json
          token: ${{ github.token }}
        env:
          LOG_LEVEL: debug
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # Global-only allowlist so postUpgradeTasks in renovate.json can rebuild dist/.
          RENOVATE_ALLOWED_COMMANDS: '["^pnpm install$", "^pnpm bundle$"]'
